name: Check container isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::callr
            any::processx
            any::evaluate
            any::lintr
            any::cyclocomp
            any::cli
            any::rlang
            any::rprojroot
            any::testthat
            any::withr
            any::sf
      - name: Build minimal checker image
        run: docker build --platform linux/amd64 -f inst/container/Dockerfile -t learncrimemapping-checker:local .
      - name: Test isolation, web downloads and private package installs
        env:
          LCM_TEST_DOCKER: 'true'
        shell: Rscript {0}
        run: |
          source("R/check_code.R")
          source("R/check_workspace.R")
          testthat::test_dir("tests/testthat", filter = "submission-container", stop_on_failure = TRUE)
