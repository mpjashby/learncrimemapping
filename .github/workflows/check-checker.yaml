name: Check code checker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dependencies: [current, minimum]
        include:
          - os: ubuntu-latest
            dependencies: minimum
            r: '4.1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r || 'release' }}
          use-public-rspm: true
      # Test the checker independently of the large course metapackage.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::callr
            any::evaluate
            any::lintr
            any::cyclocomp
            any::cli
            any::rlang
            any::rprojroot
            any::testthat
            any::remotes
          cache-version: ${{ matrix.dependencies }}
      - name: Install minimum supported checker versions
        if: matrix.dependencies == 'minimum'
        shell: Rscript {0}
        run: |
          versions <- c(callr = "3.7.0", evaluate = "1.0.0", lintr = "3.4.0",
                        rprojroot = "2.0.4")
          for (package in names(versions)) {
            remotes::install_version(package, version = versions[[package]],
                                     upgrade = "never", dependencies = FALSE)
          }
      - name: Run checker regression tests
        shell: Rscript {0}
        run: |
          source("R/check_code.R")
          testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
